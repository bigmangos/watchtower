name: Create Docker Manifests

on:
  workflow_call:
    inputs:
      build-type:
        description: "Type of build (prod or dev)"
        required: true
        type: string
      version:
        description: "Version tag for production builds (ignored for dev)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@9fe7774c8f8ebfade96f0a62aa10f3882309d517
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Docker manifests for dev
        if: ${{ inputs.build-type == 'dev' }}
        run: |
          docker buildx imagetools create -t ghcr.io/bigmangos/watchtower:latest-dev \
            ghcr.io/bigmangos/watchtower:amd64-dev \
            ghcr.io/bigmangos/watchtower:i386-dev \
            ghcr.io/bigmangos/watchtower:armhf-dev \
            ghcr.io/bigmangos/watchtower:arm64v8-dev \
            ghcr.io/bigmangos/watchtower:riscv64-dev

      - name: Create Docker manifests for prod
        if: ${{ inputs.build-type == 'prod' }}
        run: |
          # Strip the 'v' prefix from inputs.version
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          MAJOR=$(echo "$VERSION" | cut -d. --fields=1)
          MINOR=$(echo "$VERSION" | cut -d. --fields=1,2)
          docker buildx imagetools create -t "ghcr.io/bigmangos/watchtower:${VERSION}" \
            "ghcr.io/bigmangos/watchtower:amd64-${VERSION}" \
            "ghcr.io/bigmangos/watchtower:i386-${VERSION}" \
            "ghcr.io/bigmangos/watchtower:armhf-${VERSION}" \
            "ghcr.io/bigmangos/watchtower:arm64v8-${VERSION}" \
            "ghcr.io/bigmangos/watchtower:riscv64-${VERSION}"
          docker buildx imagetools create -t "ghcr.io/bigmangos/watchtower:${MINOR}" \
            "ghcr.io/bigmangos/watchtower:amd64-${MINOR}" \
            "ghcr.io/bigmangos/watchtower:i386-${MINOR}" \
            "ghcr.io/bigmangos/watchtower:armhf-${MINOR}" \
            "ghcr.io/bigmangos/watchtower:arm64v8-${MINOR}" \
            "ghcr.io/bigmangos/watchtower:riscv64-${MINOR}"
          docker buildx imagetools create -t "ghcr.io/bigmangos/watchtower:${MAJOR}" \
            "ghcr.io/bigmangos/watchtower:amd64-${MAJOR}" \
            "ghcr.io/bigmangos/watchtower:i386-${MAJOR}" \
            "ghcr.io/bigmangos/watchtower:armhf-${MAJOR}" \
            "ghcr.io/bigmangos/watchtower:arm64v8-${MAJOR}" \
            "ghcr.io/bigmangos/watchtower:riscv64-${MAJOR}"
          docker buildx imagetools create -t "ghcr.io/bigmangos/watchtower:latest" \
            "ghcr.io/bigmangos/watchtower:amd64-latest" \
            "ghcr.io/bigmangos/watchtower:i386-latest" \
            "ghcr.io/bigmangos/watchtower:armhf-latest" \
            "ghcr.io/bigmangos/watchtower:arm64v8-latest" \
            "ghcr.io/bigmangos/watchtower:riscv64-latest"
